<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Participa en rifas en línea de forma segura y transparente. Selecciona tus números, registra tus datos y gana.">
  <meta name="theme-color" content="#050505">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RifaDorada">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Open Graph -->
  <meta property="og:title" content="RifaDorada - Participa y Gana">
  <meta property="og:description" content="Selecciona tus números, registra tus datos y participa en rifas en línea.">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="RifaDorada - Participa y Gana">
  <meta name="twitter:description" content="Selecciona tus números, registra tus datos y participa en rifas en línea de forma segura.">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RifaDorada - Participa y Gana</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "RifaDorada",
    "description": "Plataforma de rifas en línea segura y transparente para Colombia",
    "applicationCategory": "EntertainmentApplication",
    "operatingSystem": "Web"
  }
  </script>

  <!-- Loading spinner while Flutter initializes -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #050505;
      overflow: hidden;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      inset: 0;
      z-index: 999;
      background-color: #050505;
      transition: opacity 0.4s ease;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 215, 0, 0.15);
      border-top: 4px solid #FFD700;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .loading-text {
      margin-top: 16px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 14px;
      color: rgba(255, 215, 0, 0.6);
      letter-spacing: 1px;
    }

    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loading indicator — auto-hidden when Flutter renders -->
  <div id="loading" class="loading-container">
    <div class="loading-spinner"></div>
    <p class="loading-text">Cargando…</p>
  </div>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#050505;color:#FFD700;font-family:'Segoe UI',sans-serif;text-align:center;padding:24px;">
      <p>Esta aplicación requiere JavaScript para funcionar. Por favor, habilítalo en tu navegador.</p>
    </div>
  </noscript>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Hide loading screen once Flutter is ready
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () { loader.remove(); }, 400);
      }
    });
  </script>
</body>
</html>
